name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时，取消旧的一次运行，省 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux：全量构建 + 全部测试（含集成测试）
  # ---------------------------------------------------------------------------
  linux:
    name: build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCHATROOM_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS：只构建平台无关的层（protocol / chat / infra）
  #
  # 这条 job 不是在"测试 macOS"，而是在**验证分层**：
  # epoll 是 Linux 独有的，net/app 在 macOS 上编译不过。如果哪天有人往
  # chat/protocol 里 include 了 <sys/epoll.h>，这里会立刻变红。
  # ---------------------------------------------------------------------------
  macos:
    name: build (macos-latest, portable layers)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install cmake ninja googletest

      - name: Configure
        # Homebrew 前缀在 Apple Silicon（/opt/homebrew）和 Intel（/usr/local）
        # 上不同，写死一个必然在另一台上找不到 GTest。
        run: |
          PREFIX="$(brew --prefix)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCHATROOM_WERROR=ON \
            -DCHATROOM_PORTABLE_ONLY=ON \
            -DCMAKE_PREFIX_PATH="$PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # 格式检查：格式问题交给工具，不要人肉在 review 里挑。
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find include src tests tools -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # 容器镜像：验证 Dockerfile 里那条 "构建 + 测试" 链路是可用的。
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build image (编译与测试都在镜像构建过程中执行)
        run: docker build -t chatroom:ci .
