# 本地开发用。生产部署不适用（这里没有编排、没有健康检查、没有重启策略）。
#
#   docker compose run --rm dev        # 进一个能编译的环境
#   docker compose up                  # 起服务器，宿主机 12345 可连

services:
  dev:
    build:
      context: .
      target: builder
    image: chatroom-dev:latest
    working_dir: /src
    volumes:
      # 绑定挂载：容器里的 /src 就是宿主机的项目目录。
      # 改代码不用重建镜像，直接重新 cmake --build 即可。
      - .:/src
    command: ["bash"]

  server:
    build:
      context: .
      target: runtime
    image: chatroom:latest
    ports:
      - "12345:12345"
    restart: unless-stopped
